<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Links Profile</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ===================================================================
         البطاقة
         كل ما تحتاج إلى تعديله معلَّم بتعليق "غيّرني".
         تحتاج فقط إلى تعديل النصوص والروابط في الأسفل — بدون إضافة
         أو حذف أي عناصر.
    ==================================================================== -->
    <main class="card">
      <!-- غيّرني: صورتك الشخصية.
           ضع ملف صورتك في هذا المجلد ثم عدّل قيمة src.
           مثال: src="my-photo.jpg" -->
      <img class="avatar" src="Nageeb.jpg" alt="Profile picture" />

      <!-- غيّرني: اسمك -->
      <h1 class="name">NAGEEB YAHYA</h1>

      <!-- غيّرني: موقعك (مدينتك ودولتك) -->
      <p class="location">MALAYSIA</p>

      <!-- غيّرني: سطر قصير يعرّف بك -->
      <p class="bio">TECHNOLGYE AWARE</p>

      <!-- الروابط.
           غيّرني: لكل رابط، عدّل النص بين الوسمين
           (مثل "GitHub") وعدّل عنوان الموقع في href="...". -->
      <nav class="links">
        <a class="link" href="https://github.com/gmisnageeb-IT" target="_blank">GitHub</a>
        <a class="link" href="https://www.facebook.com/NageebYRAlsurmi" target="_blank">facebook</a>
        <a class="link" href="https://www.instagram.com/nageebrezq/" target="_blank">instagram</a>
        <a class="link" href="https://x.com/nynageebny" target="_blank">Twitter (X)</a>
        <a class="link" href="http://nageeb.somee.com/" target="_blank">Nageeb Website</a>
      </nav>
    </main>
  </body>
</html>
